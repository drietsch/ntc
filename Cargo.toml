[workspace]
resolver = "2"
members = [
    "crates/ntc-core",
    "crates/ntc-model",
    "crates/ntc-webgpu",
    "crates/ntc-runtime",
    "crates/ntc-format",
    "crates/ntc-wasm",
    "crates/ntc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drietsch/ntc"

[workspace.dependencies]
ntc-core = { path = "crates/ntc-core" }
ntc-model = { path = "crates/ntc-model" }
ntc-webgpu = { path = "crates/ntc-webgpu" }
ntc-runtime = { path = "crates/ntc-runtime" }
ntc-format = { path = "crates/ntc-format" }

serde = { version = "1", features = ["derive"] }
# preserve_order: canonical ABI argument order = JSON declaration order
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
thiserror = "2"
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
jiff = { version = "0.2", features = ["js"] }
wgpu = "24"
naga = "24"
pollster = "0.4"
rand = "0.8"
rand_chacha = "0.3"
approx = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "thin"

# Small, fast wasm artifacts
[profile.release.package.ntc-wasm]
opt-level = "s"
