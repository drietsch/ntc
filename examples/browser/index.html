<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTC browser demo</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d6dae1;
      --text: #1c2430;
      --muted: #5a6472;
      --accent: #2456c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 0.3rem; }
    input, textarea {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: inherit;
      font: inherit;
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; resize: vertical; }
    button {
      margin-top: 1.25rem;
      padding: 0.55rem 1.4rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    pre {
      margin-top: 1.25rem;
      padding: 0.9rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
      min-height: 6rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status { color: var(--muted); font-size: 0.85rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Neural Tool Compiler</h1>
    <p class="sub">A trained neural tool-call compiler running fully in-browser: WebAssembly + WebGPU, no server. <span id="version"></span></p>

    <label for="utterance">Utterance
      <span style="float:right">
        <button id="ex-en" type="button">EN</button>
        <button id="ex-de" type="button">DE</button>
        <button id="ex-fr" type="button">FR</button>
        <button id="ex-es" type="button">ES</button>
      </span>
    </label>
    <input id="utterance" value="schedule a dentist appointment tomorrow afternoon for one and a half hours">

    <label for="context">Studio context (linked selection, resolver)
      <span style="float:right"><button id="scenario" type="button">Studio scenario</button></span>
    </label>
    <textarea id="context" rows="7" spellcheck="false">{
 "linked": [
  {"ref": "L1", "type": "asset", "id": 4711, "key": "winterjacke-hero.jpg", "path": "/Produktfotos/", "isFolder": false}
 ],
 "locale": "de"
}</textarea>

    <label for="tools">Tools (JSON array of schemas)</label>
    <textarea id="tools" rows="12" spellcheck="false">[
 {
  "name": "assign_tag",
  "description": "Assign an existing tag to an element (data object, asset, or document). Use list_tags to find tag IDs.",
  "parameters": {
   "elementType": {
    "type": "string",
    "description": "object",
    "enum": [
     "object",
     "asset",
     "document"
    ],
    "required": true
   },
   "elementId": {
    "type": "integer",
    "description": "The element ID to tag.",
    "required": true
   },
   "tagId": {
    "type": "integer",
    "description": "The tag ID to assign.",
    "required": true
   }
  }
 },
 {
  "name": "list_tags",
  "description": "List available tags. Optionally filter by parent tag to browse the tag hierarchy.",
  "parameters": {
   "parentId": {
    "type": "integer",
    "description": "Parent tag ID to list children of. Omit or set to 0 to list root-level tags."
   },
   "filter": {
    "type": "string",
    "description": "Filter tags by name (substring match)."
   },
   "page": {
    "type": "integer",
    "description": "Page number (1-based). Default: 1."
   },
   "pageSize": {
    "type": "integer",
    "description": "Results per page. Default: 50."
   },
   "timeoutMs": {
    "type": "integer",
    "description": "Soft wall-clock budget in milliseconds. Default: 5000."
   }
  }
 },
 {
  "name": "get_workflow_graph",
  "description": "Render a workflow diagram for a specific element as SVG. Returns the raw SVG string.",
  "parameters": {
   "elementId": {
    "type": "integer",
    "description": "Pimcore element ID.",
    "required": true
   },
   "elementType": {
    "type": "string",
    "description": "Element type: \"asset\" | \"document\" | \"data-object\".",
    "enum": [
     "asset",
     "document",
     "data-object"
    ],
    "required": true
   },
   "workflowName": {
    "type": "string",
    "description": "Workflow name.",
    "required": true
   }
  }
 }
]</textarea>

    <label for="timezone">Timezone (IANA)</label>
    <input id="timezone" value="Europe/Berlin">

    <label for="model">Model</label>
    <select id="model">
      <option value="studio">Studio router (Pimcore tools + context, 87 MB)</option>
      <option value="any">any-word (pretrained backbone, ~72 MB)</option>
      <option value="mini">mini (templates only, 2.8 MB)</option>
      <option value="fixture">random fixture (plumbing test)</option>
    </select>

    <label for="backend">Backend</label>
    <select id="backend">
      <option value="auto" selected>auto (WebGPU if available)</option>
      <option value="gpu">gpu (WebGPU)</option>
      <option value="cpu">cpu (reference)</option>
    </select>

    <button id="compile" disabled>Compile</button>
    <div class="status" id="status">Loading wasm module…</div>

    <pre id="output"></pre>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
